naftiko: "1.0.0-alpha1"

info:
  label: Amazon Athena API
  description: Shared capability definition for the Amazon Athena API covering query executions, named queries, work groups, data catalogs, databases, and prepared statements.
  tags:
    - Amazon Athena
    - SQL
    - Analytics
    - Serverless
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: athena
      baseUri: https://athena.us-east-1.amazonaws.com
      description: Amazon Athena for serverless SQL analytics.
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: start-query-execution
          path: /?Action=StartQueryExecution
          description: Start a SQL query execution.
          operations:
            - name: start-query-execution
              method: POST
              description: Runs SQL query statements against S3 data.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: stop-query-execution
          path: /?Action=StopQueryExecution
          description: Stop a running query execution.
          operations:
            - name: stop-query-execution
              method: POST
              description: Stops a running query execution.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: get-query-execution
          path: /?Action=GetQueryExecution
          description: Get details of a query execution.
          operations:
            - name: get-query-execution
              method: POST
              description: Returns information about a single query execution.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-query-executions
          path: /?Action=ListQueryExecutions
          description: List query executions.
          operations:
            - name: list-query-executions
              method: POST
              description: Lists query execution IDs in a workgroup.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: get-query-results
          path: /?Action=GetQueryResults
          description: Get results of a completed query.
          operations:
            - name: get-query-results
              method: POST
              description: Streams query results from S3.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: create-named-query
          path: /?Action=CreateNamedQuery
          description: Create a named query.
          operations:
            - name: create-named-query
              method: POST
              description: Creates a saved named query.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-named-queries
          path: /?Action=ListNamedQueries
          description: List named queries.
          operations:
            - name: list-named-queries
              method: POST
              description: Lists named query IDs in a workgroup.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: create-work-group
          path: /?Action=CreateWorkGroup
          description: Create a work group.
          operations:
            - name: create-work-group
              method: POST
              description: Creates a workgroup.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-work-groups
          path: /?Action=ListWorkGroups
          description: List work groups.
          operations:
            - name: list-work-groups
              method: POST
              description: Lists available workgroups.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-data-catalogs
          path: /?Action=ListDataCatalogs
          description: List data catalogs.
          operations:
            - name: list-data-catalogs
              method: POST
              description: Lists data catalogs in the account.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-databases
          path: /?Action=ListDatabases
          description: List databases in a catalog.
          operations:
            - name: list-databases
              method: POST
              description: Lists databases in a data catalog.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: list-table-metadata
          path: /?Action=ListTableMetadata
          description: List table metadata.
          operations:
            - name: list-table-metadata
              method: POST
              description: Lists table metadata for a database.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: athena-rest
      resources:
        - path: /v1/query-executions
          name: query-executions
          description: Query executions
          operations:
            - method: GET
              name: list-query-executions
              description: List query executions
              call: "athena.list-query-executions"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/named-queries
          name: named-queries
          description: Named queries
          operations:
            - method: GET
              name: list-named-queries
              description: List named queries
              call: "athena.list-named-queries"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: athena-mcp
      transport: http
      tools:
        - name: start-query-execution
          description: Run a SQL query against data in Amazon S3 using Athena.
          hints:
            readOnly: false
            openWorld: false
          call: "athena.start-query-execution"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-query-execution
          description: Get the status and details of an Athena query execution.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.get-query-execution"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-query-results
          description: Retrieve the results of a completed Athena query execution.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.get-query-results"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-query-executions
          description: List query executions in an Athena workgroup.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.list-query-executions"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-named-queries
          description: List saved named queries in an Athena workgroup.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.list-named-queries"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-work-groups
          description: List Athena workgroups in the account.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.list-work-groups"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-data-catalogs
          description: List data catalogs registered with Athena.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.list-data-catalogs"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-databases
          description: List databases in an Athena data catalog.
          hints:
            readOnly: true
            openWorld: true
          call: "athena.list-databases"
          outputParameters:
            - type: object
              mapping: "$."
